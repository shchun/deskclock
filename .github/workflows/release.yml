name: Build APK and EXE

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v1.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      android_code: ${{ steps.version.outputs.android_code }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate version tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: node scripts/release-version.cjs --check-only
      - name: Record exact source commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      DESKCLOCK_VERSION: ${{ needs.version.outputs.version }}
      DESKCLOCK_VERSION_CODE: ${{ needs.version.outputs.android_code }}
      DESKCLOCK_CI_SIGNING: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.version.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply tag version to desktop package
        run: node scripts/release-version.cjs
      - run: npm run check:desktop
      - run: npm test

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: matrix.platform == 'android'
        with:
          packages: platform-tools
      - name: Install Android SDK
        if: matrix.platform == 'android'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Sync Capacitor project
        if: matrix.platform == 'android'
        run: npx cap sync android
      - name: Build installable Android APK
        if: matrix.platform == 'android'
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Collect Android package
        if: matrix.platform == 'android'
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-assets/DeskClock-${DESKCLOCK_VERSION}-android-debug.apk"

      - name: Install Rust toolchain
        if: matrix.platform == 'windows'
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Test Windows backend
        if: matrix.platform == 'windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build Windows executable and installer
        if: matrix.platform == 'windows'
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            npm run build:windows -- -- --locked
            exit $LASTEXITCODE
          }
          if (!$env:UPDATER_PUBLIC_KEY -or !$env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Configure TAURI_UPDATER_PUBLIC_KEY and TAURI_SIGNING_PRIVATE_KEY before publishing.'
          }
          $config = @{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{
              updater = @{
                pubkey = $env:UPDATER_PUBLIC_KEY.Trim()
                endpoints = @("$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases/latest/download/latest.json")
                requireSignedVersion = $true
                windows = @{ installMode = 'passive' }
              }
            }
          }
          $configPath = Join-Path $env:RUNNER_TEMP 'deskclock-updater.json'
          $config | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $configPath -Encoding utf8
          npm run build:windows -- --config $configPath -- --locked
          exit $LASTEXITCODE
      - name: Collect Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $packages = @(Get-Item -LiteralPath src-tauri/target/release/deskclock.exe)
          if ($packages.Count -ne 1) { throw 'Expected exactly one Windows EXE' }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item -LiteralPath $packages[0].FullName -Destination "release-assets/DeskClock-$env:DESKCLOCK_VERSION-windows-x64.exe"
          $installers = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $installerName = "DeskClock-$env:DESKCLOCK_VERSION-windows-x64-setup.exe"
          Copy-Item -LiteralPath $installers[0].FullName -Destination "release-assets/$installerName"
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') {
            Copy-Item -LiteralPath "$($installers[0].FullName).sig" -Destination "release-assets/$installerName.sig"
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    if: github.event_name != 'pull_request'
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
      DESKCLOCK_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify packages and generate updater manifest
        run: |
          test -s "release-assets/DeskClock-${DESKCLOCK_VERSION}-android-debug.apk"
          test -s "release-assets/DeskClock-${DESKCLOCK_VERSION}-windows-x64.exe"
          test -s "release-assets/DeskClock-${DESKCLOCK_VERSION}-windows-x64-setup.exe"
          cd release-assets
          installer="DeskClock-${DESKCLOCK_VERSION}-windows-x64-setup.exe"
          test -s "$installer.sig"
          jq -n --arg version "$DESKCLOCK_VERSION" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$installer" \
            --arg signature "$(cat "$installer.sig")" \
            '{version: $version, platforms: {"windows-x86_64": {url: $url, signature: $signature}}}' > latest.json
          sha256sum *.apk *.exe > SHA256SUMS.txt
      - name: Create or update GitHub Release
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.apk release-assets/*.exe release-assets/*.sig release-assets/SHA256SUMS.txt --clobber
            gh release upload "$RELEASE_TAG" release-assets/latest.json --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Desk Clock $RELEASE_TAG" --generate-notes
          fi
